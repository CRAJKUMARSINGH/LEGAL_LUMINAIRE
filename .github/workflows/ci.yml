name: ci

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck + build (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies (frozen - reproducible)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Vitest suite
        run: pnpm --filter @workspace/legal-luminaire run test

      - name: Build frontend (Vite)
        run: pnpm --filter @workspace/legal-luminaire run build

      - name: Verify publish directory exists
        run: test -d artifacts/legal-luminaire/dist/public

      - name: Verify SPA index.html present (serves all client-side routes)
        run: test -f artifacts/legal-luminaire/dist/public/index.html

      - name: Verify _redirects present (SPA catch-all for Netlify)
        run: test -f artifacts/legal-luminaire/dist/public/_redirects

      - name: Verify _redirects content is correct SPA catch-all
        run: grep -q "^/\* /index.html 200" artifacts/legal-luminaire/dist/public/_redirects

      - name: Verify JS assets directory present (code-split route chunks)
        run: test -d artifacts/legal-luminaire/dist/public/assets

      - name: Verify case-selector and new data types compile cleanly
        run: pnpm --filter @workspace/legal-luminaire run typecheck

  backend:
    name: Backend syntax check (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend (syntax check)
        run: python -m compileall artifacts/legal-luminaire/backend