name: Bug Report
description: Report a bug in Legal Luminaire
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.
        **Do NOT include real client data, PII, or actual case documents.**

  - type: input
    id: page
    attributes:
      label: Page / Route
      description: Which page or route is affected?
      placeholder: e.g. /case/:id/verification or /safe-draft
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect?
      placeholder: Describe the bug clearly
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (accuracy rule violated)
        - High (feature broken)
        - Medium (UX issue)
        - Low (cosmetic)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: e.g. Chrome 126 / Windows 11
