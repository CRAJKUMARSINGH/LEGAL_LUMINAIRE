# ============================================================================
# Legal Luminaire — artifact-level netlify.toml
#
# IF Netlify UI "Base directory" = artifacts/legal-luminaire:
#   Netlify sets CWD to /opt/build/repo/artifacts/legal-luminaire
#   REPOSITORY_ROOT = /opt/build/repo  (always the checkout root)
#   We cd to REPOSITORY_ROOT so pnpm workspaces resolve correctly.
#   publish is relative to base dir.
# ============================================================================

[build]
  base    = "artifacts/legal-luminaire"
  command = "cd $REPOSITORY_ROOT && corepack enable && corepack prepare pnpm@10 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/legal-luminaire run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
  NPM_FLAGS    = "--version"

# SPA catch-all
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
