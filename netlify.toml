# ============================================================================
# Legal Luminaire — Netlify Production Config
#
# Netlify UI: Base directory = (blank/empty)  ← MUST be blank
# Build runs from repo root. pnpm activated via corepack (Node 22 image).
# ============================================================================

[build]
  command = "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --no-frozen-lockfile --ignore-scripts=false && pnpm --filter @workspace/legal-luminaire run build"
  publish = "artifacts/legal-luminaire/dist/public"

[build.environment]
  NODE_VERSION    = "22"
  PNPM_VERSION    = "10"
  # Force --no-frozen-lockfile for ALL pnpm invocations including Netlify's
  # automatic pre-build install step (frozen-lockfile fails because lockfile
  # was generated on Windows; ignoredOptionalDependencies differs on Linux).
  PNPM_FLAGS      = "--no-frozen-lockfile"
  NPM_FLAGS       = "--version"
  CI              = "true"

# SPA catch-all — every client-side route returns index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
