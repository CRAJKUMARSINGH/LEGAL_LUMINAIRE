# ============================================================================
# Legal Luminaire — ROOT netlify.toml
#
# Netlify UI settings:
#   Repository:    CRAJKUMARSINGH/LEGAL_LUMINAIRE
#   Base directory: (blank — repo root)
#   Build command:  (leave blank — taken from this file)
#   Publish dir:    artifacts/legal-luminaire/dist/public
#   Node version:   22
# ============================================================================

[build]
  base    = ""
  command = "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/legal-luminaire run build"
  publish = "artifacts/legal-luminaire/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
  # Prevent Netlify auto-running npm install before our command
  NPM_FLAGS    = "--version"

# SPA catch-all: every path returns index.html (200, not 301)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
